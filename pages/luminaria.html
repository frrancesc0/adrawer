<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agrid - Calculadora de Luminaria</title>
  <link rel="stylesheet" href="../css/tool.css">
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="menu-open">

  <header class="tool-header">
    <a href="../index.html" class="brand-link">agrid<span class="brand-highlight">luminaria</span></a>
  </header>

  <main class="tool-container page-content" id="main-content">
    <div class="calculator-box entry-animator">
      
<div class="calc-group">
        <label class="calc-label">Tipo de Recinto e Iluminancia (lx)</label>
        <div class="input-row">
          <div class="unit-pill">
            <select id="room-select" class="unit-select">
              <option placeholder="" disabled selected>Selecciona recinto...</option>
              
              <optgroup label="Iluminación General (Hogar)">
                <option placeholder="250" value="250">Cocina (Centro/Tránsito)</option>
                <option placeholder="200" value="200">Habitación / Dormitorio</option>
                <option placeholder="150" value="150">Pasillo / Hall</option>
                <option placeholder="300" value="300">Sala de estar / Comedor</option>
                <option placeholder="100" value="100">Bodega / Almacén</option>
              </optgroup>
              
              <optgroup label="Iluminación de Tarea (Trabajo)">
                <option placeholder="500" value="500">Cocina (Mesón de trabajo)</option>
                <option placeholder="500" value="500">Oficina / Escritorio</option>
                <option placeholder="750" value="750">Taller / Laboratorio</option>
              </optgroup>
            </select>
          </div>
          <input type="number" id="lux" class="input-card input-small" placeholder="300" value="300" step="10">
        </div>
        <span id="smart-label" style="font-size: 0.85rem; font-weight: 300; margin-top: 0.2rem; display: none; text-align: center;"></span>
      </div>

      <div class="calc-group">
        <label class="calc-label">Plano de trabajo (m)</label>
        <div class="input-row">
          <input type="number" id="work-plane" class="input-card input-large" placeholder="0.85" value="0.85" step="0.05">
        </div>
      </div>

      <div class="calc-group">
        <label class="calc-label">Reflejo % (Techo / Pared / Suelo)</label>
        <div class="input-row">
          <input type="number" id="rho-ceiling" class="input-card input-small" placeholder="70" value="70" min="0" max="100">
          <span class="colon-separator">/</span>
          <input type="number" id="rho-wall" class="input-card input-small" placeholder="50" value="50" min="0" max="100">
          <span class="colon-separator">/</span>
          <input type="number" id="rho-floor" class="input-card input-small" placeholder="20" value="20" min="0" max="100">
        </div>
      </div>

      <div class="calc-group">
        <label class="calc-label">Factor de Mantenimiento (FM)</label>
        <div class="input-row">
          <input type="number" id="maintenance-factor" class="input-card input-large" placeholder="0.80" value="0.80" step="0.05" min="0.1" max="1">
        </div>
      </div>

      <div class="calc-group">
        <label class="calc-label">Dimensiones (Largo × Ancho × Alto en m)</label>
        <div class="input-row">
          <input type="number" id="length" class="input-card input-small" placeholder="Largo" step="0.1">
          <span class="colon-separator">×</span>
          <input type="number" id="width" class="input-card input-small" placeholder="Ancho" step="0.1">
          <span class="colon-separator">×</span>
          <input type="number" id="height" class="input-card input-small" placeholder="Alto" step="0.1">
        </div>
      </div>

      <div class="calc-group">
        <label class="calc-label">Longitud de suspensión de lámpara (m)</label>
        <div class="input-row">
          <input type="number" id="suspension" class="input-card input-large" placeholder="0.00" value="0.00" step="0.05">
        </div>
      </div>

      <div class="calc-group">
        <label class="calc-label">Flujo por Foco / Lámpara (lm)</label>
        <div class="input-row">
          <input type="number" id="lamp-lumens" class="input-card input-large" placeholder="1000" value="1000" step="50">
        </div>
      </div>

      <div class="calc-group">
        <label class="calc-label" style="color: #76ff89; font-weight: 600;">Cantidad de Focos Requeridos</label>
        <div class="input-row">
          <input type="text" id="result-fixtures" class="input-card input-large" placeholder="0" readonly style="border-color: #76ff89; font-weight: 600; color: #76ff89;">
        </div>
      </div>

    </div>
  </main>
